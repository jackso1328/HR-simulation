<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>NOVA HR — Workforce Simulator</title>
  <meta name="description" content="An interactive HR strategy simulator for college Business Intelligence seminars.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

<!-- ═══════════════════════════
     INTRO SCREEN
═══════════════════════════ -->
<div id="intro-screen" class="screen active">

  <div class="intro-wrap">

    <!-- Hero -->
    <div class="intro-hero">
      <div class="intro-logo-mark">N</div>
      <h1 class="intro-title">NOVA HR</h1>
      <p class="intro-tagline">Workforce Strategy Simulator</p>
    </div>

    <!-- Scenario Picker -->
    <div class="intro-section">
      <p class="section-eyebrow">Choose a scenario</p>
      <div class="scenario-scroll" id="scenario-grid"></div>
    </div>

    <!-- Difficulty -->
    <div class="intro-section">
      <p class="section-eyebrow">Difficulty</p>
      <div class="seg-control" id="diff-control">
        <button class="seg-btn active" data-diff="beginner">Beginner</button>
        <button class="seg-btn" data-diff="manager">Manager</button>
        <button class="seg-btn" data-diff="chro">CHRO</button>
      </div>
    </div>

    <!-- Journey Stats -->
    <div id="intro-journey" class="journey-row"></div>

    <!-- CTA -->
    <div class="intro-cta">
      <button id="btn-start-simulation" class="btn-hero">Begin Simulation</button>
      <button id="btn-random-scenario" class="btn-ghost-sm">🎲 Random</button>
    </div>

  </div>
</div>

<!-- ═══════════════════════════
     APP SCREEN
═══════════════════════════ -->
<div id="app-screen" class="screen hidden">

  <!-- TOP BAR -->
  <header id="top-bar">
    <div class="tb-left">
      <div class="tb-logo">N</div>
      <div class="tb-scenario" id="tb-scenario-name">AI Medical Imaging</div>
    </div>
    <div class="tb-kpis" id="tb-kpis">
      <!-- injected per phase -->
    </div>
    <div class="tb-right">
      <button id="btn-reset-top" class="tb-icon-btn" title="Restart">↩</button>
    </div>
  </header>

  <!-- PROGRESS STEPS -->
  <div id="progress-bar">
    <div class="progress-steps" id="progress-steps">
      <!-- injected -->
    </div>
  </div>

  <!-- MAIN CONTENT AREA -->
  <main id="main-panel">
    <div id="dynamic-content"></div>
  </main>

  <!-- BOTTOM NAV (mobile only) -->
  <nav id="bottom-nav">
    <button class="bnav-btn" data-phase="1" id="bnav-1">
      <span class="bnav-icon">📋</span>
      <span class="bnav-label">Plan</span>
    </button>
    <button class="bnav-btn" data-phase="4" id="bnav-4">
      <span class="bnav-icon">🎯</span>
      <span class="bnav-label">Strategy</span>
    </button>
    <button class="bnav-btn" data-phase="6" id="bnav-6">
      <span class="bnav-icon">👥</span>
      <span class="bnav-label">Talent</span>
    </button>
    <button class="bnav-btn" data-phase="7" id="bnav-7">
      <span class="bnav-icon">🎓</span>
      <span class="bnav-label">Train</span>
    </button>
    <button class="bnav-btn" data-phase="9" id="bnav-9">
      <span class="bnav-icon">📈</span>
      <span class="bnav-label">Report</span>
    </button>
  </nav>

  <!-- TERMINAL (hidden) -->
  <div id="terminal" class="hidden">
    <div class="term-header">
      <span>⚡ Command Mode</span>
      <button onclick="document.getElementById('terminal').classList.add('hidden')">✕</button>
    </div>
    <div id="terminal-output"></div>
    <div class="term-input-row">
      <span class="term-prompt">›</span>
      <input type="text" id="command-input" placeholder="type help..." autocomplete="off" spellcheck="false">
    </div>
  </div>

</div>

<!-- MODAL (bottom sheet on mobile, centered on desktop) -->
<div id="modal-overlay" class="hidden" onclick="if(event.target===this) window.HRUI.closeModal()">
  <div id="modal-box">
    <button id="btn-close-modal" class="modal-close-btn" onclick="window.HRUI.closeModal()">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast-container"></div>

<!-- EVENT NOTIFICATION (injected dynamically) -->

<!-- SCRIPTS -->
<script src="./js/scenarios.js"></script>
<script src="./js/state.js"></script>
<script src="./js/engine.js"></script>
<script src="./js/events.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/charts.js"></script>
<script src="./js/terminal.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
